name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Install
        run: pip install -r requirements/requirements.txt -r requirements/requirements-dev.txt
      - name: Lint
        run: python -m pyflakes src tests
      - name: Test
        # Excel (COM) and the raw price file are not available on a runner. Those tests are marked and skipped.
        run: python -m pytest -q -m "not office and not needs_inputs"
